    body {

    }

    /* Floating gradient orbs behind content */
    #root::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 700px at 15% 30%, rgba(99,102,241,0.18) 0%, transparent 70%),

        radial-gradient(circle 350px at 70% 10%, rgba(236,72,153,0.10) 0%, transparent 70%);
      animation: bgDrift 18s ease-in-out infinite alternate;
    }
    #root {
      position: relative;
      z-index: 1;
    }

    @keyframes bgDrift {
      0%   { transform: translateY(0px) scale(1); }
      33%  { transform: translateY(-18px) scale(1.02); }
      66%  { transform: translateY(10px) scale(0.99); }
      100% { transform: translateY(-8px) scale(1.01); }
    }

    /* Subtle grid overlay for depth */
    #root::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Custom polished scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.7); }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glassmorphic card surfaces */
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-card-light {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Shimmer animation for skeleton/highlight */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .animate-shimmer {
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.15) 50%, transparent 75%);
      background-size: 800px 100%;
      animation: shimmer 2s infinite;
    }

    /* Float up animation for hero elements */
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-float-up {
      animation: floatUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;

      const [reviews, setReviews] = useState(REPUTATION_REVIEWS);
      const [toasts, setToasts] = useState([]);

      const showToast = (title, message = '', type = 'success') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => removeToast(id), 4500);
      };

      const removeToast = (id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      };

      const sendExchangeRequest = ({ student, requestedSkill, offeredSkill, message, proposedSlot = "This Weekend" }) => {
        const newReq = {
          id: `req-${Date.now()}`,
          type: 'sent',
          status: 'pending',
          student: {
            id: student.id,
            name: student.name,
            avatar: student.avatar,
            department: student.department,
            year: student.year,
            rating: student.rating
          },
          requestedSkill,
          offeredSkill,
          message,
          date: 'Just now',
          proposedSlot
        };
        setRequests(prev => [newReq, ...prev]);
        showToast('Exchange Request Sent! 🚀', `Your proposal to swap ${offeredSkill} for ${requestedSkill} was sent to ${student.name}.`, 'success');
        setRequestModalStudent(null);
      };

      const acceptRequest = (requestId) => {
        let accepted = null;
        setRequests(prev => prev.map(req => {
          if (req.id === requestId) {
            accepted = req;
            return { ...req, status: 'accepted', type: 'accepted' };
          }
          return req;
        }));

        if (accepted) {
          const exists = conversations.find(c => c.partnerId === accepted.student.id);
          if (!exists) {
            const newConv = {
              id: `conv-${Date.now()}`,
              partnerId: accepted.student.id,
              partnerName: accepted.student.name,
              partnerAvatar: accepted.student.avatar,
              department: `${accepted.student.department} - ${accepted.student.year}`,
              online: true,
              skillExchange: `${accepted.offeredSkill} ⇄ ${accepted.requestedSkill}`,
              lastMessage: `Accepted skill exchange! Let's schedule our first session.`,
              lastTime: 'Just now',
              unread: 0,

              <span className="px-3 py-1 rounded-full bg-purple-500/20 text-purple-200 text-xs font-bold uppercase mb-2 inline-block">
                Operations & Administration
              </span>
              <h1 className="text-2xl sm:text-3xl font-black">SkillBridge Admin Console</h1>
              <p className="text-xs text-purple-200 mt-1">Manage student verifications, skills directory, and platform metrics.</p>
            </div>
            <button onClick={() => navigateTo('dashboard')} className="px-4 py-2 rounded-xl bg-white/20 text-xs font-bold">
              Exit to Student View
            </button>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-soft">
              <span className="text-xs font-bold text-slate-400 uppercase">Total Students</span>
              <div className="text-3xl font-black text-slate-900 mt-1">{ADMIN_STATS.totalStudents}</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-soft">
              <span className="text-xs font-bold text-slate-400 uppercase">Active Exchanges</span>
              <div className="text-3xl font-black text-slate-900 mt-1">{ADMIN_STATS.activeExchanges}</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-soft">
              <span className="text-xs font-bold text-slate-400 uppercase">Popular Skills</span>
              <div className="text-3xl font-black text-slate-900 mt-1">{ADMIN_STATS.popularSkillsCount}</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-soft">
              <span className="text-xs font-bold text-slate-400 uppercase">Pending Reports</span>
              <div className="text-3xl font-black text-rose-600 mt-1">{ADMIN_STATS.pendingReports}</div>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200 shadow-soft overflow-hidden">
            <div className="p-5 border-b border-slate-100">
              <h3 className="font-extrabold text-base text-slate-900">User Management</h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="bg-slate-50 text-slate-400 font-bold uppercase border-b border-slate-100">
                    <th className="p-4">Student</th>
                    <th className="p-4">Dept & Year</th>
                    <th className="p-4">Skills</th>
                    <th className="p-4">Status</th>
                    <th className="p-4">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                  {users.map(u => (
                    <tr key={u.id} className="hover:bg-slate-50">
                      <td className="p-4 font-bold text-slate-900">{u.name}</td>
                      <td className="p-4">{u.dept} ({u.year} Yr)</td>
                      <td className="p-4">{u.skills}</td>
                      <td className="p-4">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${u.verified ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                          {u.verified ? 'Verified' : 'Pending'}
                        </span>
                      </td>
                      <td className="p-4">
                        <button onClick={() => toggleVerify(u.id)} className="px-3 py-1 rounded-lg border border-slate-200 text-xs font-bold hover:bg-slate-100">
                          {u.verified ? 'Revoke' : 'Verify ID'}
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 15.5. VIEW 12: DASHBOARD LOGIN PAGE
    // ==========================================
    const DashboardLoginPage = () => {
      const { navigateTo, setIsAuthenticated, setCurrentUser, setIsAdmin, showToast } = useExchange();
      const [role, setRole] = useState('student');
      const [email, setEmail] = useState('alex.johnson@campus.edu');
      const [password, setPassword] = useState('student123');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(true);
      const [isLoading, setIsLoading] = useState(false);

      const handleLogin = (e) => {
        e.preventDefault();
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          setIsAuthenticated(true);
          if (role === 'admin') {
            setIsAdmin(true);
            showToast('Admin Access Granted 🛡️', 'Welcome to Campus Management.', 'info');
            navigateTo('admin');
          } else {
            setIsAdmin(false);
            showToast('Welcome to Dashboard! 👋', 'Signed into Student Skill Exchange.', 'success');
            navigateTo('dashboard');
          }
        }, 500);
      };

      const handleQuickLogin = (type) => {
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          setIsAuthenticated(true);
          if (type === 'rahul') {
            setCurrentUser(prev => ({
              ...prev,
              name: "Rahul Sharma",
              email: "rahul.s@campus.edu",
              department: "Information Technology",
              year: "2nd Year",
              avatar: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80",
              reputationScore: 4.9
            }));
            setIsAdmin(false);
            showToast('Welcome back, Rahul! 👋', 'Logged into Student Dashboard.', 'success');
            navigateTo('dashboard');
          } else if (type === 'priya') {
            setCurrentUser(prev => ({
              ...prev,
              name: "Priya Sundaram",
              email: "priya.s@campus.edu",
              department: "Computer Science",
              year: "3rd Year",
              avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80",
              reputationScore: 5.0
            }));
            setIsAdmin(false);
            showToast('Welcome back, Priya! 🎨', 'Logged into Student Dashboard.', 'success');
            navigateTo('dashboard');
          } else if (type === 'admin') {
            setIsAdmin(true);
            showToast('Admin Console Ready 🛡️', 'Logged into SkillBridge Operations.', 'info');
            navigateTo('admin');
          }
        }, 400);
      };

      return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 sm:p-6 lg:p-8 animate-fade-in font-sans">
          <div className="max-w-4xl w-full bg-white rounded-3xl shadow-soft-xl border border-slate-200 overflow-hidden grid grid-cols-1 lg:grid-cols-12">
            
            {/* Left Side */}
            <div className="lg:col-span-5 bg-gradient-to-br from-brand-900 via-indigo-950 to-brand-950 text-white p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden">
              <div>
                <div onClick={() => navigateTo('landing')} className="inline-flex items-center space-x-2.5 cursor-pointer mb-8 select-none">
                  <div className="w-10 h-10 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-soft">
                    <Icon name="ArrowRightLeft" className="w-5 h-5" />
                  </div>
                  <span className="font-extrabold text-xl tracking-tight text-white">
                    Skill<span className="text-brand-400">Bridge</span>
                  </span>
                </div>

                <span className="px-3 py-1 rounded-full bg-white/10 text-brand-200 text-xs font-bold uppercase tracking-wider inline-block mb-3">
                  Campus Dashboard Portal
                </span>
                <h2 className="text-2xl sm:text-3xl font-black tracking-tight leading-snug mb-3">
                  Your Skills. <br />
                  Your Peer Network.
                </h2>
                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed mb-6">
                  Sign in to manage active skill exchanges, review incoming requests, chat with peer mentors, and check your reputation score.
                </p>

                <div className="p-4 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 space-y-3 text-xs">
                  <div className="flex items-center justify-between">
                    <span className="text-slate-300 font-semibold">Active Barter Network</span>
                    <span className="text-emerald-400 font-bold flex items-center space-x-1">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                      <span>Live</span>
                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-center">
                    <div className="p-2 rounded-xl bg-black/20">
                      <span className="text-[10px] text-slate-400 block">Pending Requests</span>
                      <span className="text-sm font-black text-amber-300">2 Inquiries</span>
                    </div>
                    <div className="p-2 rounded-xl bg-black/20">
                      <span className="text-[10px] text-slate-400 block">Reputation Score</span>
                      <span className="text-sm font-black text-white">4.9 ★</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="mt-8 pt-4 border-t border-white/10 flex items-center justify-between text-xs text-slate-400">
                <span className="flex items-center space-x-1">
                  <Icon name="ShieldCheck" className="w-4 h-4 text-emerald-400" />
                  <span>Verified Campus Sign-in</span>
                </span>
                <button onClick={() => navigateTo('landing')} className="text-white hover:underline font-semibold">
                  Home
                </button>
              </div>
            </div>

            {/* Right Side */}
            <div className="lg:col-span-7 p-6 sm:p-8 lg:p-10 flex flex-col justify-between">
              <div>
                <div className="mb-6">
                  <h3 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    Log In to Dashboard
                  </h3>
                  <p className="text-xs text-slate-500 mt-1">
                    Enter your campus credentials or use one-click demo access.
                  </p>
                </div>

                <div className="flex p-1 bg-slate-100 rounded-2xl mb-6">
                  <button
                    type="button"
                    onClick={() => { setRole('student'); setEmail('alex.johnson@campus.edu'); }}
                    className={`flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all flex items-center justify-center space-x-1.5 ${
                      role === 'student' ? 'bg-white text-brand-600 shadow-sm' : 'text-slate-500'
                    }`}
                  >
                    <Icon name="User" className="w-3.5 h-3.5" />
                    <span>Student / Peer Mentor</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => { setRole('admin'); setEmail('admin@campus.edu'); }}
                    className={`flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all flex items-center justify-center space-x-1.5 ${
                      role === 'admin' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500'
                    }`}
                  >
                    <Icon name="Shield" className="w-3.5 h-3.5" />
                    <span>Campus Admin</span>
                  </button>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      {role === 'student' ? 'Student Campus Email' : 'Administrator Email'}
                    </label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                        Password
                      </label>
                      <span className="text-[11px] font-bold text-brand-600 cursor-pointer" onClick={() => showToast('Help', 'Contact campus administration.', 'info')}>
                        Forgot password?
                      </span>
                    </div>
                    <div className="relative">
                      <input
                        type={showPassword ? "text" : "password"}
                        required
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 p-1"
                      >
                        <Icon name="Eye" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2 text-xs text-slate-600">
                    <input
                      type="checkbox"
                      checked={rememberMe}
                      onChange={(e) => setRememberMe(e.target.checked)}
                      className="rounded border-slate-300 text-brand-600 w-4 h-4"
                    />
                    <span>Remember me on this campus device</span>
                  </div>

                  <button
                    type="submit"
                    disabled={isLoading}
                    className={`w-full py-3.5 rounded-xl text-white font-extrabold text-xs sm:text-sm shadow-soft flex items-center justify-center space-x-2 ${
                      role === 'admin' ? 'bg-purple-600 hover:bg-purple-700' : 'bg-brand-600 hover:bg-brand-700'
                    }`}
                  >
                    {isLoading ? (
                      <span>Signing into Dashboard...</span>
                    ) : (
                      <>
                        <span>Sign In to {role === 'admin' ? 'Admin Console' : 'Dashboard'}</span>
                        <Icon name="ChevronRight" className="w-4 h-4" />
                      </>
                    )}
                  </button>
                </form>

                {/* Demo Quick Logins */}
                <div className="mt-6 pt-5 border-t border-slate-100">
                  <p className="text-center text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2.5">
                    Instant One-Click Demo Profiles
                  </p>
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      type="button"
                      onClick={() => handleQuickLogin('rahul')}
                      className="p-2 rounded-xl border border-slate-200 hover:border-brand-300 hover:bg-brand-50 text-[11px] font-bold text-slate-700 flex flex-col items-center justify-center"
                    >
                      <span className="font-extrabold text-slate-900">Rahul S.</span>
                      <span className="text-[10px] text-slate-400">IT 2nd Yr</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => handleQuickLogin('priya')}
                      className="p-2 rounded-xl border border-slate-200 hover:border-brand-300 hover:bg-brand-50 text-[11px] font-bold text-slate-700 flex flex-col items-center justify-center"
                    >
                      <span className="font-extrabold text-slate-900">Priya S.</span>
                      <span className="text-[10px] text-slate-400">CSE 3rd Yr</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => handleQuickLogin('admin')}
                      className="p-2 rounded-xl border border-purple-200 hover:border-purple-300 hover:bg-purple-50 text-[11px] font-bold text-purple-700 flex flex-col items-center justify-center"
                    >
                      <span className="font-extrabold text-purple-900">Admin</span>
                      <span className="text-[10px] text-purple-500">Moderator</span>
                    </button>
                  </div>
                </div>

              </div>

              <p className="text-center text-xs text-slate-500 mt-6 pt-4 border-t border-slate-100">
                Need a new student account?{' '}
                <button onClick={() => navigateTo('login')} className="font-bold text-brand-600 hover:underline">
                  Sign up free
                </button>
              </p>
            </div>

          </div>
        </div>
      );
    };

    // ==========================================
    // 16. MAIN APP COMPONENT
    // ==========================================
    const App = () => {
      const { activeTab } = useExchange();
      const isFullScreen = activeTab === 'landing' || activeTab === 'login' || activeTab === 'dashboard-login';

      return (
        <div className="min-h-screen text-slate-900 font-sans flex flex-col" style={{position:'relative', zIndex:2}}>
          <Navbar />

          {isFullScreen ? (
            <main className="flex-1">
              {activeTab === 'landing' && <LandingPage />}
              {activeTab === 'login' && <AuthPage />}
              {activeTab === 'dashboard-login' && <DashboardLoginPage />}
            </main>
          ) : (
            <div className="flex-1 max-w-7xl w-full mx-auto flex">
              <Sidebar />
              <main className="flex-1 p-4 sm:p-6 lg:p-8 pb-24 md:pb-8 min-w-0 overflow-y-auto">
                {activeTab === 'dashboard' && <DashboardView />}
                {activeTab === 'explore' && <ExploreSkillsView />}
                {activeTab === 'students' && <FindStudentsView />}
                {activeTab === 'recommendations' && <RecommendationsView />}
                {activeTab === 'requests' && <RequestsView />}
                {activeTab === 'profile' && <StudentProfileView />}
                {activeTab === 'reputation' && <ReputationView />}
                {activeTab === 'messages' && <MessagesView />}
                {activeTab === 'admin' && <AdminDashboardView />}
              </main>
            </div>
          )}

          {!isFullScreen && <BottomNav />}

          <SendRequestModal />
          <StudentDetailModal />
          <ToastContainer />
        </div>
      );
    };

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ExchangeProvider>
        <App />
      </ExchangeProvider>
    );
  </script>
</body>
</html>
